name: ci

on: [push, pull_request]

jobs:
    check:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: [22, 24]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci --omit=optional
            - run: npm run check
            - run: npm pack --dry-run
