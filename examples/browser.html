<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>xgamepad controller monitor</title>
        <style>
            :root {
                color-scheme: dark;
                font:
                    16px system-ui,
                    sans-serif;
                background: #111820;
                color: #e7eef5;
            }
            body {
                max-width: 64rem;
                margin: 4rem auto;
                padding: 0 1.5rem;
            }
            h1 {
                font-size: 2.5rem;
                letter-spacing: -0.04em;
            }
            p {
                color: #a6b6c6;
            }
            article {
                border: 1px solid #334455;
                border-radius: 1rem;
                padding: 1.5rem;
                margin: 1rem 0;
            }
            pre {
                overflow: auto;
                font-size: 0.85rem;
            }
            button {
                background: #8ce8d3;
                color: #10201d;
                border: 0;
                border-radius: 0.4rem;
                padding: 0.75rem 1rem;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>xgamepad</h1>
        <p>
            Connect a controller, focus this page, then press a button. Standard mappings are
            detected automatically.
        </p>
        <p id="status" role="status">Waiting for a controller.</p>
        <main id="controllers"></main>
        <script type="module" src="./browser.js"></script>
    </body>
</html>
